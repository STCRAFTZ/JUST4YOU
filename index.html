<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday 🎉</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0b2e, #2d1b4e, #1a0b2e);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .balloon {
      position: absolute;
      width: 55px;
      height: 70px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      cursor: pointer;
      animation: float 6s ease-in-out infinite;
      z-index: 5;
      transition: transform 0.3s;
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -18px;
      left: 50%;
      width: 2px;
      height: 35px;
      background: rgba(255,255,255,0.5);
      transform: translateX(-50%);
    }

    .balloon:hover {
      transform: scale(1.15);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-25px) rotate(3deg); }
    }

    .container {
      text-align: center;
      z-index: 20;
      max-width: 800px;
      width: 100%;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 3.8rem);
      font-weight: 800;
      background: linear-gradient(90deg, #ff6b9d, #ffd166, #a0e7e5, #ff6b9d);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 4s ease infinite;
      margin-bottom: 8px;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .subtitle {
      font-size: 1.2rem;
      color: #e0c3fc;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .name-box {
      margin-bottom: 30px;
    }

    input {
      padding: 13px 22px;
      font-size: 1.1rem;
      border: none;
      border-radius: 50px;
      background: rgba(255,255,255,0.12);
      color: white;
      outline: none;
      width: 260px;
      text-align: center;
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.2);
      transition: all 0.3s;
    }

    input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    input:focus {
      background: rgba(255,255,255,0.2);
      border-color: #ff6b9d;
      box-shadow: 0 0 18px rgba(255,107,157,0.4);
    }

    /* ===== PHOTO GALLERY ===== */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 30px auto;
      max-width: 520px;
    }

    .photo {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      border: 3px solid rgba(255,255,255,0.15);
      transition: all 0.35s ease;
    }

    .photo:hover {
      transform: scale(1.05);
      border-color: #ff6b9d;
      box-shadow: 0 12px 35px rgba(255,107,157,0.4);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(255,107,157,0.3);
    }

    .lightbox-close {
      position: absolute;
      top: 25px;
      right: 30px;
      font-size: 2.2rem;
      color: white;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .lightbox-close:hover {
      opacity: 1;
    }

    /* Cake */
    .cake-area {
      margin: 35px 0 15px;
      position: relative;
      display: inline-block;
    }

    .cake {
      width: 170px;
      height: 110px;
      background: linear-gradient(to bottom, #ff9a9e, #fecfef);
      border-radius: 10px 10px 18px 18px;
      position: relative;
      box-shadow: 0 10px 28px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .cake::before {
      content: '';
      position: absolute;
      top: -22px;
      left: 18px;
      right: 18px;
      height: 28px;
      background: #ff6b9d;
      border-radius: 50% 50% 0 0;
    }

    .cake::after {
      content: '';
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 22px;
      background: #ffd166;
      border-radius: 7px 7px 0 0;
    }

    .candle {
      position: absolute;
      width: 9px;
      height: 32px;
      background: #fff;
      border-radius: 3px;
      top: -65px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .flame {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 15px;
      height: 20px;
      background: radial-gradient(circle, #ffeb3b, #ff9800);
      border-radius: 50% 50% 20% 20%;
      animation: flicker 0.15s infinite alternate;
      box-shadow: 0 0 14px #ff9800, 0 0 28px #ff5722;
    }

    .flame.out {
      opacity: 0;
      transform: translateX(-50%) scale(0);
      transition: all 0.4s;
    }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.1) rotate(2deg); }
    }

    .blow-btn {
      margin-top: 20px;
      padding: 13px 30px;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      background: linear-gradient(90deg, #ff6b9d, #c44569);
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255,107,157,0.4);
      transition: all 0.3s;
    }

    .blow-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(255,107,157,0.55);
    }

    .message {
      margin-top: 28px;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e0c3fc;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.7s ease;
    }

    .message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .footer {
      margin-top: 35px;
      font-size: 0.9rem;
      opacity: 0.55;
    }

    .celebrate {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffd166;
      text-shadow: 0 0 20px #ff6b9d;
      z-index: 100;
      pointer-events: none;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .celebrate.show {
      transform: translate(-50%, -50%) scale(1);
    }

    @media (max-width: 500px) {
      .gallery {
        gap: 12px;
        max-width: 340px;
      }
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <!-- Balloons -->
  <div class="balloon" style="left:8%; top:12%; background:#ff6b9d; animation-delay:0s;"></div>
  <div class="balloon" style="left:22%; top:38%; background:#ffd166; animation-delay:1.1s;"></div>
  <div class="balloon" style="left:78%; top:18%; background:#a0e7e5; animation-delay:0.5s;"></div>
  <div class="balloon" style="left:88%; top:48%; background:#c44569; animation-delay:1.7s;"></div>
  <div class="balloon" style="left:4%; top:58%; background:#9b59b6; animation-delay:0.8s;"></div>
  <div class="balloon" style="left:65%; top:8%; background:#3498db; animation-delay:2s;"></div>

  <div class="container">
    <h1 id="title">Happy Birthday!</h1>
    <p class="subtitle">Wishing you a day full of joy ✨</p>

    <div class="name-box">
      <input type="text" id="nameInput" placeholder="Enter name here..." maxlength="20" />
    </div>

    <!-- Photo Gallery -->
    <div class="gallery">
      <div class="photo" onclick="openLightbox(this)">
        <img src="photo1.jpg" alt="Memory 1" />
      </div>
      <div class="photo" onclick="openLightbox(this)">
        <img src="photo2.jpg" alt="Memory 2" />
      </div>
      <div class="photo" onclick="openLightbox(this)">
        <img src="photo3.jpg" alt="Memory 3" />
      </div>
      <div class="photo" onclick="openLightbox(this)">
        <img src="photo4.jpg" alt="Memory 4" />
      </div>
    </div>

    <div class="cake-area">
      <div class="cake" id="cake">
        <div class="candle">
          <div class="flame" id="flame"></div>
        </div>
      </div>
    </div>

    <button class="blow-btn" id="blowBtn">🎂 Blow the Candles</button>

    <p class="message" id="message">
      May your special day be filled with laughter, love, and all the happiness you deserve.  
      Here’s to another amazing year ahead! 🥳❤️
    </p>

    <p class="footer">Made with 💖 for you</p>
  </div>

  <div class="celebrate" id="celebrate">🎉 Yay! 🎉</div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Full photo" />
  </div>

  <script>
    // Confetti
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confettiPieces = [];
    const colors = ['#ff6b9d', '#ffd166', '#a0e7e5', '#c44569', '#9b59b6', '#3498db', '#ffffff'];

    class Confetti {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height - canvas.height;
        this.size = Math.random() * 8 + 4;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.speed = Math.random() * 3 + 1.5;
        this.angle = Math.random() * 360;
        this.spin = Math.random() * 0.2 - 0.1;
      }
      update() {
        this.y += this.speed;
        this.angle += this.spin;
        if (this.y > canvas.height) {
          this.y = -20;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle * Math.PI / 180);
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
      }
    }

    for (let i = 0; i < 110; i++) confettiPieces.push(new Confetti());

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiPieces.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateConfetti);
    }
    animateConfetti();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Name
    const nameInput = document.getElementById('nameInput');
    const title = document.getElementById('title');
    nameInput.addEventListener('input', () => {
      const name = nameInput.value.trim();
      title.textContent = name ? `Happy Birthday, ${name}!` : 'Happy Birthday!';
    });

    // Blow candles
    const flame = document.getElementById('flame');
    const blowBtn = document.getElementById('blowBtn');
    const message = document.getElementById('message');
    const celebrate = document.getElementById('celebrate');
    const cake = document.getElementById('cake');

    function blowCandles() {
      flame.classList.add('out');
      message.classList.add('show');
      celebrate.classList.add('show');
      for (let i = 0; i < 35; i++) confettiPieces.push(new Confetti());
      setTimeout(() => celebrate.classList.remove('show'), 2000);
      setTimeout(() => flame.classList.remove('out'), 5000);
    }

    blowBtn.addEventListener('click', blowCandles);
    cake.addEventListener('click', blowCandles);

    // Balloons
    document.querySelectorAll('.balloon').forEach(b => {
      b.addEventListener('click', () => {
        b.style.transition = 'all 0.6s';
        b.style.transform = 'translateY(-140px) scale(1.3)';
        b.style.opacity = '0';
        setTimeout(() => {
          b.style.transform = '';
          b.style.opacity = '1';
        }, 800);
      });
    });

    // Lightbox
    function openLightbox(el) {
      const img = el.querySelector('img');
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    // Close lightbox with Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
